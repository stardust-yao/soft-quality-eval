[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soft-quality-eval"
version = "0.1.0"
description = "软质量评测（说人话）：措辞 3 项 + 信息组织 8 项，分基线/评估/观察"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["jieba>=0.42"]

[project.scripts]
plaineval = "plaineval.cli:main"

[tool.setuptools]
packages = ["plaineval"]
